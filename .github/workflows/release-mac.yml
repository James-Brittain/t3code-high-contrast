# Standalone macOS DMG build.
#
# The main release.yml already builds macOS DMGs, but only as one leg of the
# full release pipeline: it runs on blacksmith-* self-hosted runners and needs
# an npm publish token and a Discord webhook. This workflow resolves the public
# T3 Connect config from the official published t3 package and builds the same
# artifact standalone on a GitHub-hosted runner.
#
# Builds arm64 only (every Mac since 2020). To also ship Intel, turn the job
# into a matrix over arch and pass it to the dist script.
name: Release Mac

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.0.24)"
        required: true
        type: string
      source_ref:
        description: "Branch or commit to build"
        required: false
        default: main
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean
      signed:
        description: "Require Apple Developer ID signing and notarization"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  t3_connect_public_config:
    name: Verify T3 Connect public config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      clerk_publishable_key: ${{ steps.config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.config.outputs.relay_url }}
      source_package_version: ${{ steps.config.outputs.source_package_version }}
    env:
      RELEASE_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.ref }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - id: config
        name: Resolve and verify public config
        run: node scripts/resolve-t3-connect-public-config.mjs

  release_mac:
    name: Build and publish macOS DMG
    needs: t3_connect_public_config
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      RELEASE_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.ref }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease || 'false' }}
      RELEASE_SIGNED: ${{ github.event_name == 'push' || github.event.inputs.signed == 'true' }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.t3_connect_public_config.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.t3_connect_public_config.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.t3_connect_public_config.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.t3_connect_public_config.outputs.relay_url }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0

      # Tag pushes carry their own commit; a workflow_dispatch build resolves
      # whatever source_ref pointed at, so the release is pinned to the exact
      # tree that produced the DMG.
      - id: release_commit
        name: Resolve release commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # The dist script does not install the Electron runtime itself, so the
      # desktop build needs the same explicit step CI uses.
      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Format
        run: vp fmt --check

      - name: Lint
        run: vp lint --report-unused-disable-directives

      - name: Typecheck
        run: vp run -r --concurrency-limit 2 typecheck

      - name: Build macOS DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ "$RELEASE_SIGNED" != "true" ]]; then
            echo "Building an explicitly requested unsigned artifact."
            vp run dist:desktop:dmg:arm64
            exit 0
          fi

          missing=()
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_API_KEY \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Signed release requested, but these GitHub settings are missing: %s\n' \
              "${missing[*]}" >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"

          vp run dist:desktop:dmg:arm64 -- --signed

      - name: Verify Apple signature and notarization
        if: env.RELEASE_SIGNED == 'true'
        run: |
          dmg_path="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          zip_path="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          if [[ -z "$dmg_path" || -z "$zip_path" ]]; then
            echo "Signed DMG or ZIP artifact is missing." >&2
            exit 1
          fi

          verify_dir="$RUNNER_TEMP/t3code-signature-verification"
          mkdir -p "$verify_dir"
          ditto -x -k "$zip_path" "$verify_dir"
          app_path="$(find "$verify_dir" -maxdepth 2 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "The ZIP does not contain an app bundle." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.release_commit.outputs.sha }}
          generate_release_notes: true
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          fail_on_unmatched_files: true
